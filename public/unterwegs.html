<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1915" />
    <title>Kletterglück unterwegs</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f0e6;
        --ink: #1c1915;
        --muted: #3f3a33;
        --paper: #fffdf8;
        --line: #1c1915;
        --accent: #8f3d1b;
        --ok: #14532d;
        --bad: #7f1d1d;
        --warn: #7c2d12;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #12110f;
        --ink: #f6f1e7;
        --muted: #ddd4c4;
        --paper: #1c1a17;
        --line: #f6f1e7;
        --accent: #e7b08a;
        --ok: #bbf7d0;
        --bad: #fecaca;
        --warn: #fdba74;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 1.125rem/1.4 'Segoe UI', 'Avenir Next', 'Helvetica Neue', sans-serif;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #unterwegs { max-width: 760px; margin: 0 auto; padding: 12px; }
      header, section, .notice {
        background: var(--paper);
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 12px;
      }
      h1 { font-size: 1.8rem; line-height: 1.15; margin: 8px 0; }
      p, dd, dt { margin: 0 0 8px; }
      .status { font-weight: 700; }
      .status.on { color: var(--ok); }
      .status.off { color: var(--bad); }
      .warn { color: var(--warn); font-weight: 700; }
      .source { color: var(--muted); font-size: 1rem; }
      button, a.ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        min-width: 56px;
        padding: 12px 16px;
        border-radius: 14px;
        border: 2px solid var(--line);
        background: var(--accent);
        color: #fffdf8;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      html[data-theme='dark'] button,
      html[data-theme='dark'] a.ghost { color: #1c1915; }
      button.ghost, a.ghost {
        background: transparent;
        color: var(--ink);
      }
      button:disabled { opacity: 0.45; }
      button:focus-visible, a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .card {
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        margin-bottom: 8px;
      }
      canvas {
        width: 100%;
        height: 280px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
      }
      dl { display: grid; gap: 8px; }
      dl div {
        display: grid;
        gap: 2px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      dt { font-size: 0.95rem; color: var(--muted); }
      dd { font-size: 1.35rem; font-weight: 700; }
      .notice p:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <div id="unterwegs">
      <p>Unterwegs-Ansicht wird gelesen …</p>
    </div>
    <script src="/kletterglueck-field.js"></script>
  </body>
</html>
